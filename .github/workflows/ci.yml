# Runs on every pull request and every push to main. main should only accept pull requests where
# this passes (branch protection: see docs/SCALE-PLAN.md, Release process).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No Sentry in CI: the app runs with crash reporting off.
      EXPO_PUBLIC_SENTRY_DSN: ''
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # check:dates runs TypeScript directly, which needs Node 24 (README, Requirements).
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dates, money and summaries
        run: npm run check:dates

      - name: Colour contrast
        run: npm run check:contrast

      - name: Tests
        run: npm test -- --ci

      - name: Web build
        run: npx expo export -p web
